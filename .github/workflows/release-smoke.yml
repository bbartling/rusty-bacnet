name: Release smoke test

# Runs the macOS and Windows release artifacts on GitHub-hosted runners before
# anything is published (#951). The Forgejo runner cross-compiles them but can
# run neither, and GitHub's runners can't reach Forgejo, so Forgejo's release
# workflow puts the artifacts on a GitHub draft release (the one the GitHub
# copy publishes later, or a dry run's throwaway draft), dispatches this
# workflow with the draft's id, and waits for the result
# (scripts/release/release_smoke.py). Nothing else triggers it.
#
# GitHub shows a draft release only to tokens with write access: the job token
# gets HTTP 403 for one with contents: read. So the fetch job alone has
# contents: write, runs only the release commit's release_smoke.py, which only
# reads, and checks every asset against the draft's SHA256SUMS. The smoke jobs,
# which run the artifacts, get them as workflow artifacts, and their token can
# only read this public repository. See docs/ci.md, "Smoke test".

run-name: Release smoke ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Id of the GitHub draft release holding the artifacts
        required: true
        type: string
      sums_sha256:
        description: sha256 of the draft's SHA256SUMS
        required: true
        type: string
      version:
        description: Release version, in Cargo's form
        required: true
        type: string
      commit:
        description: Release commit, whose scripts run the checks
        required: true
        type: string
      pythons:
        description: CPython versions with wheels
        required: true
        type: string
      correlation_id:
        description: Names the run, so that the release workflow finds it
        required: true
        type: string

permissions: {}

jobs:
  fetch:
    name: Fetch the draft's assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The least that can read a draft release (see the top).
      contents: write
    steps:
      # Inputs reach scripts only through the environment, and only in these forms.
      - name: Check the inputs
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          SUMS: ${{ inputs.sums_sha256 }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          PYTHONS: ${{ inputs.pythons }}
        shell: bash
        run: |
          [[ $RELEASE_ID =~ ^[0-9]+$ ]] || { echo "::error::release_id isn't a number"; exit 1; }
          [[ $SUMS =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sums_sha256 isn't a sha256"; exit 1; }
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::version isn't a Cargo version"; exit 1; }
          [[ $COMMIT =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit isn't a full commit sha"; exit 1; }
          # This job's token can write, so it runs only this run's own commit's
          # scripts: a dispatch can't pick another commit's code.
          [ "$COMMIT" = "$GITHUB_SHA" ] \
            || { echo "::error::commit $COMMIT isn't this run's commit $GITHUB_SHA, the head of $GITHUB_REF"; exit 1; }
          # The smoke jobs below set up exactly these Pythons.
          [ "$PYTHONS" = "3.11 3.12 3.13 3.14" ] \
            || { echo "::error::the release has wheels for CPython $PYTHONS; update the smoke jobs' setup-python steps and this check"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: scripts/release
          persist-credentials: false
      - name: Download the macOS and Windows assets, and check them against SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          SUMS: ${{ inputs.sums_sha256 }}
          PYTHONS: ${{ inputs.pythons }}
        shell: bash
        run: |
          # shellcheck disable=SC2086 # PYTHONS is a list.
          python3 scripts/release/release_smoke.py fetch --release-id "$RELEASE_ID" --sums "$SUMS" \
            --python $PYTHONS --out assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-macos-arm64
          path: assets/macos-arm64/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-macos-x86_64
          path: assets/macos-x86_64/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-windows-x86_64
          path: assets/windows-x86_64/
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Smoke test (${{ matrix.name }})
    needs: fetch
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Report every platform even when one fails.
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            platform: macos-arm64
            cli: bacnet-macos-arm64
          # GitHub's newest Intel macOS image.
          - name: macOS x86_64
            os: macos-26-intel
            platform: macos-x86_64
            cli: bacnet-macos-amd64
          - name: Windows x86_64
            os: windows-latest
            platform: windows-x86_64
            cli: bacnet-windows-amd64.exe
    defaults:
      run:
        # Git Bash on Windows.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: scripts/release
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-${{ matrix.platform }}
          path: assets
      # Each interpreter's path comes from its step's output; none is put on PATH.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py311
        with:
          python-version: "3.11"
          update-environment: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py312
        with:
          python-version: "3.12"
          update-environment: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py313
        with:
          python-version: "3.13"
          update-environment: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py314
        with:
          python-version: "3.14"
          update-environment: false
      # Each wheel in a fresh venv of its own CPython: import, the serial port
      # listing (IOKit and CoreFoundation on macOS, SetupAPI on Windows) and a
      # loopback client/server round trip (scripts/release/wheel_smoke.py).
      - name: Wheels, CPython 3.11 to 3.14
        env:
          PY311: ${{ steps.py311.outputs.python-path }}
          PY312: ${{ steps.py312.outputs.python-path }}
          PY313: ${{ steps.py313.outputs.python-path }}
          PY314: ${{ steps.py314.outputs.python-path }}
          VERSION: ${{ inputs.version }}
        run: |
          uname -a
          tmp=$RUNNER_TEMP
          # D:/a/... paths, which both bash and native programs accept.
          if [ "$RUNNER_OS" = Windows ]; then tmp=$(cygpath -m "$tmp"); fi
          for py in 3.11 3.12 3.13 3.14; do
            tag=cp${py/./}
            var=PY${py/./}
            interpreter=${!var}
            if [ "$RUNNER_OS" = Windows ]; then interpreter=$(cygpath -m "$interpreter"); fi
            wheels=(assets/rusty_bacnet-*-"$tag-$tag"-*.whl)
            [ ${#wheels[@]} = 1 ] && [ -f "${wheels[0]}" ] || { echo "::error::expected one $tag wheel, found: ${wheels[*]}"; exit 1; }
            venv=$tmp/venv-$tag
            "$interpreter" -m venv "$venv"
            bin=$venv/bin
            if [ "$RUNNER_OS" = Windows ]; then bin=$venv/Scripts; fi
            "$bin/python" -m pip install -q --disable-pip-version-check --no-index --no-deps "${wheels[0]}"
            echo "::group::${wheels[0]##*/}"
            "$bin/python" -I scripts/release/wheel_smoke.py --version "$VERSION"
            echo "::endgroup::"
          done
      # --version, --help and the README quickstart read against a server on
      # the cp312 wheel. These builds have no packet capture.
      - name: CLI
        env:
          CLI: ${{ matrix.cli }}
          VERSION: ${{ inputs.version }}
        run: |
          tmp=$RUNNER_TEMP
          if [ "$RUNNER_OS" = Windows ]; then tmp=$(cygpath -m "$tmp"); fi
          python=$tmp/venv-cp312/bin/python
          if [ "$RUNNER_OS" = Windows ]; then python=$tmp/venv-cp312/Scripts/python; fi
          # Artifacts drop the executable bit.
          chmod +x "assets/$CLI"
          bash scripts/release/cli_smoke.sh --no-capture --expect-version "$VERSION" "assets/$CLI" "$python"
