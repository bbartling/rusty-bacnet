name: Release

# Releases run on Forgejo (#943), so the heavy work stays on the fixed-cost
# runner VM; GitHub only receives a copy of each release. The jobs run on the
# Linux amd64 runner in the CI image, which ci.yml builds, and cross-compile
# every artifact there: Linux and macOS with zig, Windows with xwin's MSVC CRT
# and SDK (#944). GitHub-hosted runners then run the macOS and Windows
# artifacts (#951, .github/workflows/release-smoke.yml) before anything is
# published. See docs/ci.md, "Release".
#
#   v* tag pushed     validate (preflight both release hosts, wait for CI on
#                     the tag), build, test the artifacts, smoke-test them on
#                     GitHub from the GitHub draft, then publish in order:
#                     crates.io, PyPI, the Forgejo release, the GitHub release
#                     copy (that same draft)
#   manual dispatch   dry_run (default true) builds and tests everything, runs
#                     the smoke test against a throwaway GitHub draft that it
#                     deletes again, runs the release API calls read only, and
#                     publishes nothing. dry_run=false is accepted only on a v*
#                     tag, and runs that tag's release again.
#
# Every publish job is safe to re-run: it skips what is already published, and
# each release stays a draft until its last asset is up (GitHub releases are
# immutable once published). Forgejo deletes a run's artifacts when any of its
# jobs is re-run, so resume a partial release with "Re-run all jobs", which
# rebuilds and tests everything before the publish jobs pick up where they
# stopped.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only; publish nothing
        type: boolean
        default: true

# Least privilege for the job token, for when Forgejo honours `permissions`.
# Forgejo currently ignores the key and gives every job the same token, which
# can write to this repository. Only Validate (the preflight's disposable
# draft) and the Forgejo release job need to write.
permissions:
  contents: read
  statuses: read

concurrency:
  # One run per ref, and never cancel a run that may be publishing.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The same tag as ci.yml; its "CI image" job fails if they differ.
  CI_IMAGE: forgejo.taile9ca5.ts.net/jscott3201/rusty-bacnet-ci:45c95fae1133
  # The newest glibc any artifact may need: manylinux2014 for the wheels, and
  # RHEL/CentOS 7, Debian 8, Ubuntu 14.04 and later for the CLI. The image's
  # static libpcap targets the same version.
  GLIBC: "2.17"
  PYTHONS: "3.11 3.12 3.13 3.14"

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipeline fails the step.
    shell: bash

jobs:
  image:
    name: CI image
    runs-on: linux-host
    timeout-minutes: 10
    steps:
      # As in ci.yml: the registry needs sign-in to pull and job containers never
      # pull, so the image is pulled into the VM's Docker here. Only ci.yml builds it.
      - name: Pull the job image
        env:
          REGISTRY_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          registry=${CI_IMAGE%%/*}
          # Under RUNNER_TEMP, which the runner deletes even if the job is killed.
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$REGISTRY_TOKEN" | docker login "$registry" -u "$REGISTRY_USER" --password-stdin
          docker pull -q "$CI_IMAGE" \
            || { echo "::error::cannot pull $CI_IMAGE; ci.yml's image job builds it, so run CI on this commit first"; exit 1; }

  # Everything a release needs before anything is built. On a tag it also
  # waits up to 15 minutes for the mirror's tag and up to 60 for the tag's own
  # CI run, so allow for that.
  validate:
    name: Validate
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 95
    permissions:
      contents: write
      statuses: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, for the ancestry check.
          fetch-depth: 0
          persist-credentials: false
      - name: Release script tests
        run: |
          python3 -m unittest discover -s scripts/release
          python3 -m unittest discover -s scripts -p 'test_changelog.py'
      - name: Version, tag and mode
        id: release
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          # Every publishable crate carries the workspace version, and the Python
          # package takes it from crates/rusty-bacnet.
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '
            [.packages[] | select(.publish != []) | .version] | unique
            | if length == 1 then .[0] else error("publishable crates disagree: \(.)") end')
          tag=
          case "$GITHUB_REF" in refs/tags/v*) tag=${GITHUB_REF#refs/tags/} ;; esac
          commit=$(git rev-parse HEAD)
          publish=true
          if [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN_INPUT" != false ]; then publish=false; fi
          if [ "$publish" = true ] && [ -z "$tag" ]; then
            echo "::error::only a v* tag publishes, and $GITHUB_REF is not one; dispatch with dry_run=true"
            exit 1
          fi
          if [ -n "$tag" ]; then
            [ "$tag" = "v$version" ] || { echo "::error::tag $tag does not match the workspace version $version"; exit 1; }
            git merge-base --is-ancestor HEAD origin/dev || git merge-base --is-ancestor HEAD origin/main \
              || { echo "::error::$tag ($commit) is on neither dev nor main"; exit 1; }
          fi
          echo "version $version, tag ${tag:-none}, commit $commit, publish $publish"
          { echo "version=$version"; echo "tag=$tag"; echo "commit=$commit"; echo "publish=$publish"; } >>"$GITHUB_OUTPUT"
      # Only whether each secret is set reaches the step, never its value.
      - name: Publish secrets are set
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
          HAVE_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
          HAVE_PYPI_PUBLISH: ${{ secrets.PYPI_PUBLISH != '' }}
          HAVE_GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN != '' }}
        run: |
          missing=()
          for name in CARGO_REGISTRY_TOKEN PYPI_PUBLISH GH_RELEASE_TOKEN; do
            have=HAVE_$name
            [ "${!have}" = true ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "every publish secret is set"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::set these repository secrets before releasing: ${missing[*]} (docs/ci.md, Secrets)"
            exit 1
          else
            echo "::warning::a release would stop here: ${missing[*]} not set (not needed for a dry run)"
          fi
      # Before any build, prove that both hosts will take this release: GitHub
      # has the tag at this commit, each token lists releases (drafts
      # included), and each host accepts a disposable draft with files named
      # like the assets, which is deleted again. A dry run does the read-only
      # part for v<version>, and on GitHub only the tag check while
      # GH_RELEASE_TOKEN isn't set. See docs/ci.md, "Preflight".
      - name: Release preflight
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          FORGEJO_TOKEN: ${{ github.token }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          mode=()
          if [ "$PUBLISH" != true ]; then mode=(--dry-run); TAG=v$VERSION; fi
          python3 scripts/release/release_api.py forgejo --preflight --tag "$TAG" --commit "$COMMIT" "${mode[@]}"
          python3 scripts/release/release_api.py github --preflight --tag "$TAG" --commit "$COMMIT" \
            --wait-tag 900 "${mode[@]}"
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir notes
          # A tag needs its version's section, assembled from changelog.d/ with
          # no fragment left over. A dry run uses that section if it exists,
          # otherwise the section the waiting fragments would make (maybe none),
          # assembled into a copy so CHANGELOG.md and changelog.d/ stay as they are.
          if [ -n "$TAG" ]; then
            python3 scripts/changelog.py check --no-fragments
            section=(--version "$VERSION")
          elif python3 scripts/release/changelog_notes.py --version "$VERSION" >/dev/null 2>&1; then
            section=(--version "$VERSION")
          else
            assembled="$(mktemp -d)/CHANGELOG.md"
            python3 scripts/changelog.py assemble --version "$VERSION" --allow-empty --output "$assembled"
            section=(--version "$VERSION" --allow-empty --changelog "$assembled")
          fi
          echo "notes: changelog_notes.py ${section[*]}"
          python3 scripts/release/changelog_notes.py "${section[@]}" >notes/notes.md
          # GitHub refuses release bodies over 125,000 characters.
          python3 scripts/release/changelog_notes.py "${section[@]}" --max-chars 120000 \
            --full-url "https://github.com/jscott3201/rusty-bacnet/blob/${TAG:-dev}/CHANGELOG.md" >notes/notes-github.md
          wc -c notes/*
      - name: Third-party notices
        run: |
          cargo fetch --locked
          mkdir notices
          python3 scripts/release/third_party_notices.py --out notices/THIRD-PARTY-NOTICES --libpcap /opt/libpcap
      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error
      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: notices
          path: notices/
          if-no-files-found: error
      # Last, because on a tag it waits for the tag's CI run: CI OK and the heavy
      # jobs (MSRV, audit and deny), which run on tag pushes but not on dev.
      - name: CI passed on this commit
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.release.outputs.commit }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          mode=(--wait 3600)
          [ "$PUBLISH" = true ] || mode=(--warn-only)
          python3 scripts/release/ci_gate.py --commit "$COMMIT" "${mode[@]}" \
            --context "CI / CI OK (push)" \
            --context "CI / MSRV (Linux native) (push)" \
            --context "CI / Cargo Audit + Deny (push)"

  source:
    name: Crates and sdist
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Packages every publishable crate and builds each against the others as
      # they would be published (multi-package publish, Cargo 1.90 and later).
      - name: cargo publish --workspace --dry-run
        run: cargo publish --workspace --dry-run --locked
      - name: What the crates.io job would publish (read only)
        run: bash scripts/release/publish_crates.sh --dry-run
      # pyproject.toml's license-files puts it in the sdist.
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: notices
          path: crates/rusty-bacnet
      # The dry run keeps its .crate files in Cargo's scratch directories;
      # `cargo package` writes the same packages to target/package/. Unlike
      # publish, `package --workspace` would include the publish = false crates.
      # SOURCE_DATE_EPOCH pins the sdist's timestamps, so a rebuild matches.
      - name: .crate files and sdist
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.publish != []) | "--package=\(.name)"')
          # shellcheck disable=SC2086 # One flag per word.
          cargo package --locked --no-verify $packages
          mkdir crate-files
          cp target/package/*.crate crate-files/
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) maturin sdist -m crates/rusty-bacnet/Cargo.toml --out dist
      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: crates
          path: crate-files/
          if-no-files-found: error
      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: sdist
          path: dist/
          if-no-files-found: error

  # The minimum macOS versions here, in the CLI matrix and in the artifact test's
  # platform tags are those of the 0.11.0 wheels and Rust's defaults: 10.12 on
  # x86_64, 11.0 on arm64. The artifact test fails if a binary disagrees with its tag.
  wheels:
    name: Wheels (${{ matrix.name }})
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          # zig links against glibc 2.17.
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            maturin: --zig --compatibility manylinux2014
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            maturin: --zig --compatibility manylinux2014
          - name: macos-x86_64
            target: x86_64-apple-darwin
            maturin: --zig
            macos: "10.12"
          - name: macos-arm64
            target: aarch64-apple-darwin
            maturin: --zig
            macos: "11.0"
          # maturin's built-in xwin, with the image's MSVC CRT and Windows SDK.
          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            maturin: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pyproject.toml's license-files puts it in each wheel's .dist-info/licenses/.
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: notices
          path: crates/rusty-bacnet
      # The Windows builds take xwin's CRT and SDK from the image (/opt/xwin/xwin),
      # pinned there. cargo-xwin would quietly download the latest ones into that
      # directory if it found them missing, so the build must leave it
      # untouched. (cargo-xwin rewrites its tool links and CMake files next to
      # it, in /opt/xwin, on every build.)
      - name: Mark the image's CRT and SDK
        if: endsWith(matrix.target, '-windows-msvc')
        run: |
          [ "$XWIN_CACHE_DIR" = /opt/xwin ] && [ -f /opt/xwin/xwin/DONE ] \
            || { echo "::error::the image's xwin CRT and SDK aren't in /opt/xwin (XWIN_CACHE_DIR=$XWIN_CACHE_DIR)"; exit 1; }
          touch /tmp/xwin-before
      # The image has only Python 3.12; for the other versions, and for macOS
      # and Windows, maturin uses its bundled sysconfig. SOURCE_DATE_EPOCH pins
      # the wheels' timestamps, so a rebuild matches.
      - name: maturin build
        env:
          TARGET: ${{ matrix.target }}
          MATURIN_ARGS: ${{ matrix.maturin }}
          MACOS: ${{ matrix.macos }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          if [ -n "$MACOS" ]; then
            # maturin's wheel tag and zig's target (zig-macos.sh) both take the
            # minimum macOS from this.
            export MACOSX_DEPLOYMENT_TARGET=$MACOS
            export CARGO_ZIGBUILD_ZIG_PATH=$PWD/scripts/release/zig-macos.sh
            # Link stubs for IOKit and CoreFoundation, which serialport (MS/TP)
            # uses: zig has no Apple frameworks, and there's no SDK here.
            export RUSTFLAGS="-C link-arg=-F$PWD/scripts/release/macos-frameworks"
          fi
          case "$TARGET" in
            # No PDB, and a timestamp that hashes the output, as for the CLI.
            *-windows-msvc) export RUSTFLAGS="-C link-arg=/DEBUG:NONE -C link-arg=/Brepro" ;;
          esac
          # shellcheck disable=SC2086 # MATURIN_ARGS and PYTHONS are lists.
          maturin build --release --locked $MATURIN_ARGS --target "$TARGET" -i $PYTHONS \
            -m crates/rusty-bacnet/Cargo.toml --out dist
      - name: No CRT or SDK download
        if: endsWith(matrix.target, '-windows-msvc')
        run: |
          changed=$(find /opt/xwin/xwin -newer /tmp/xwin-before | head -20 || true)
          [ -z "$changed" ] || { echo "::error::the build changed the image's CRT and SDK:"; echo "$changed"; exit 1; }
          default_cache=${XDG_CACHE_HOME:-$HOME/.cache}/cargo-xwin
          [ ! -e "$default_cache" ] || { echo "::error::cargo-xwin used $default_cache, not /opt/xwin"; exit 1; }
          echo "the build used the image's CRT and SDK and downloaded nothing"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: wheels-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Packet capture (pcap) only on Linux, as in 0.11.0.
  cli:
    name: CLI (${{ matrix.name }})
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            libpcap: x86_64
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            libpcap: aarch64
          - name: macos-amd64
            target: x86_64-apple-darwin
            macos: "10.12"
          - name: macos-arm64
            target: aarch64-apple-darwin
            macos: "11.0"
          - name: windows-amd64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # See the wheels job.
      - name: Mark the image's CRT and SDK
        if: endsWith(matrix.target, '-windows-msvc')
        run: |
          [ "$XWIN_CACHE_DIR" = /opt/xwin ] && [ -f /opt/xwin/xwin/DONE ] \
            || { echo "::error::the image's xwin CRT and SDK aren't in /opt/xwin (XWIN_CACHE_DIR=$XWIN_CACHE_DIR)"; exit 1; }
          touch /tmp/xwin-before
      - name: Build
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          MACOS: ${{ matrix.macos }}
          LIBPCAP: ${{ matrix.libpcap }}
          # The image's static libpcap's version, stated: the pcap crate's build
          # script would otherwise try to load libpcap.so to ask, and that is the
          # linker-script shim.
          LIBPCAP_VER: "1.10.7"
        run: |
          bin=bacnet asset=bacnet-$NAME
          case "$TARGET" in
            *-linux-gnu)
              [ "$(cat /opt/libpcap/VERSION)" = "$LIBPCAP_VER" ] \
                || { echo "::error::the image has libpcap $(cat /opt/libpcap/VERSION); set LIBPCAP_VER to it"; exit 1; }
              # The image's static libpcap (.forgejo/ci-image/Dockerfile).
              LIBPCAP_LIBDIR=/opt/libpcap/$LIBPCAP/lib LIBPCAP_VER=$LIBPCAP_VER \
                cargo zigbuild --release --locked -p bacnet-cli --features sc-tls,pcap --target "$TARGET.$GLIBC"
              ;;
            *-apple-darwin)
              # zig-macos.sh gives zig the minimum macOS (see the wheels job).
              MACOSX_DEPLOYMENT_TARGET=$MACOS CARGO_ZIGBUILD_ZIG_PATH=$PWD/scripts/release/zig-macos.sh \
                cargo zigbuild --release --locked -p bacnet-cli --features sc-tls --target "$TARGET"
              ;;
            *-windows-msvc)
              # The C runtime linked statically, so the CLI doesn't need the
              # Visual C++ Redistributable (VCRUNTIME140.dll). No PDB, whose
              # temporary paths would change the build ID on every build, and
              # lld-link's /Brepro, which puts a hash of the output where the
              # timestamps go, so a rebuild matches.
              RUSTFLAGS="-C target-feature=+crt-static -C link-arg=/DEBUG:NONE -C link-arg=/Brepro" \
                cargo xwin build --release --locked -p bacnet-cli --features sc-tls --target "$TARGET"
              bin=bacnet.exe asset=bacnet-$NAME.exe
              ;;
            *) echo "::error::no build for $TARGET"; exit 1 ;;
          esac
          mkdir out
          cp "target/$TARGET/release/$bin" "out/$asset"
      - name: No CRT or SDK download
        if: endsWith(matrix.target, '-windows-msvc')
        run: |
          changed=$(find /opt/xwin/xwin -newer /tmp/xwin-before | head -20 || true)
          [ -z "$changed" ] || { echo "::error::the build changed the image's CRT and SDK:"; echo "$changed"; exit 1; }
          default_cache=${XDG_CACHE_HOME:-$HOME/.cache}/cargo-xwin
          [ ! -e "$default_cache" ] || { echo "::error::cargo-xwin used $default_cache, not /opt/xwin"; exit 1; }
          echo "the build used the image's CRT and SDK and downloaded nothing"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: cli-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  verify:
    name: Test the artifacts
    needs: [validate, source, wheels, cli]
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          path: artifacts
      # Exactly what the publish jobs upload; artifacts drop the executable bit.
      - name: Collect the release assets
        run: |
          mkdir release
          cp artifacts/cli-*/* artifacts/wheels-*/* artifacts/sdist/* artifacts/notices/THIRD-PARTY-NOTICES release/
          chmod +x release/bacnet-*
          ls -l release
          (cd release && sha256sum -- *)
      # Static checks of every file, the macOS and Windows ones included: only
      # the smoke job, on GitHub, can run those (docs/ci.md, "What is and isn't
      # tested").
      - name: Versions, wheel tags, notices, architectures and linkage
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # shellcheck disable=SC2086 # PYTHONS is a list.
          python3 scripts/release/check_artifacts.py release --release-version "$VERSION" --glibc "$GLIBC" \
            --python $PYTHONS \
            --wheel-platform manylinux_2_17_x86_64.manylinux2014_x86_64 \
              manylinux_2_17_aarch64.manylinux2014_aarch64 macosx_10_12_x86_64 macosx_11_0_arm64 win_amd64 \
            --cli bacnet-linux-amd64=linux_x86_64 bacnet-linux-arm64=linux_aarch64 \
              bacnet-macos-amd64=macosx_10_12_x86_64 bacnet-macos-arm64=macosx_11_0_arm64 \
              bacnet-windows-amd64.exe=win_amd64 \
            --notices release/THIRD-PARTY-NOTICES
      - name: Python suite against the installed x86_64 cp312 wheel
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --no-index release/rusty_bacnet-*-cp312-cp312-manylinux_2_17_x86_64.*.whl
          /tmp/venv/bin/python -c 'import rusty_bacnet; print(rusty_bacnet.__file__)'
          /tmp/venv/bin/python -m unittest discover -s crates/rusty-bacnet/tests
      - name: CLI smoke test (amd64)
        run: bash scripts/release/cli_smoke.sh release/bacnet-linux-amd64 /tmp/venv/bin/python
      # The other x86_64 wheels: install each into its own interpreter and serve
      # the CLI's loopback read from it.
      - name: x86_64 wheels for CPython 3.11, 3.13 and 3.14
        run: |
          for py in $PYTHONS; do
            [ "$py" != 3.12 ] || continue
            tag=cp${py/./}
            uv python install --no-bin "$py"
            uv venv -q -p "$py" "/tmp/venv-$tag"
            uv pip install -q --python "/tmp/venv-$tag/bin/python" --no-index \
              release/rusty_bacnet-*-"$tag-$tag"-manylinux_2_17_x86_64.*.whl
            echo "== $("/tmp/venv-$tag/bin/python" --version)"
            bash scripts/release/cli_smoke.sh "release/bacnet-linux-amd64" "/tmp/venv-$tag/bin/python"
          done
      # The aarch64 wheels are only checked by check_artifacts.py: their tags,
      # module names, architecture and linkage. The macOS and Windows ones run
      # in the smoke job, on GitHub.
      - name: CLI smoke test (arm64, under qemu-user)
        env:
          CLI_WRAPPER: qemu-aarch64-static -L /usr/aarch64-linux-gnu
        run: bash scripts/release/cli_smoke.sh --offline release/bacnet-linux-arm64 python3
      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  # The macOS and Windows artifacts, run on GitHub-hosted runners (#951): stage
  # the release's files on a GitHub draft (a release's own draft, which the
  # GitHub copy later publishes unchanged; a dry run's throwaway draft), dispatch
  # .github/workflows/release-smoke.yml against it, and wait for the result. A
  # failure or timeout stops the release before anything is published. See
  # docs/ci.md, "Smoke test".
  smoke:
    name: Smoke test (macOS, Windows)
    needs: [validate, verify]
    if: success()
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 90
    outputs:
      release_id: ${{ steps.gate.outputs.release_id }}
      sums_sha256: ${{ steps.gate.outputs.sums_sha256 }}
    env:
      PUBLISH: ${{ needs.validate.outputs.publish }}
      HAVE_GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN != '' }}
      THROWAWAY: release-smoke-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: release-assets
          path: release
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: release-notes
          path: notes
      # Leaves time for the clean-up step if it runs out.
      - name: Stage the GitHub draft, run the smoke workflow, wait for it
        id: gate
        timeout-minutes: 80
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          if [ "$HAVE_GH_RELEASE_TOKEN" != true ]; then
            # Validate already stops a release without the token; a release never skips this.
            [ "$PUBLISH" != true ] || { echo "::error::GH_RELEASE_TOKEN isn't set, so the smoke test can't run"; exit 1; }
            echo "::warning::GH_RELEASE_TOKEN isn't set, so this dry run skips the smoke test"
            exit 0
          fi
          mode=(--tag "$TAG" --wait-tag 900)
          [ "$PUBLISH" = true ] || mode=(--tag "v$VERSION" --throwaway "$THROWAWAY")
          # shellcheck disable=SC2086 # PYTHONS is a list.
          python3 scripts/release/release_smoke.py gate "${mode[@]}" --commit "$COMMIT" --version "$VERSION" \
            --python $PYTHONS --notes notes/notes-github.md --assets release --ref "$GITHUB_REF" --timeout 3600
      # The gate deletes a dry run's draft itself; this covers a gate that was
      # killed first.
      - name: Delete the throwaway draft
        if: always() && env.PUBLISH != 'true' && env.HAVE_GH_RELEASE_TOKEN == 'true'
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: python3 scripts/release/release_smoke.py discard --name "$THROWAWAY"

  # Dry runs only: the release API calls a real run would make, read only. The
  # GitHub half needs GH_RELEASE_TOKEN and is skipped without it.
  release-api:
    name: Release API (dry run)
    needs: [validate, verify]
    if: success() && needs.validate.outputs.publish != 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: release-assets
          path: release
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: release-notes
          path: notes
      - name: Forgejo release (read only)
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          TAG: v${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          python3 scripts/release/release_api.py forgejo --dry-run --tag "$TAG" --commit "$COMMIT" \
            --notes notes/notes.md --assets release
      - name: GitHub release copy (read only)
        env:
          HAVE_GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN != '' }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG: v${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          if [ "$HAVE_GH_RELEASE_TOKEN" != true ]; then
            echo "::notice::GH_RELEASE_TOKEN isn't set, so the GitHub dry run is skipped"
            exit 0
          fi
          python3 scripts/release/release_api.py github --dry-run --tag "$TAG" --commit "$COMMIT" \
            --notes notes/notes-github.md --assets release --wait-tag 900

  # Publishing: tag runs only, after every build and test, the smoke test
  # included, passed, one step at a time so a failure stops everything after it.
  # Each `if:` states success() because Forgejo leaves the implicit one to the
  # runner.
  crates-io:
    name: Publish to crates.io
    needs: [validate, verify, smoke]
    if: success() && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo publish (the crates not on crates.io yet)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/release/publish_crates.sh

  pypi:
    name: Publish to PyPI
    needs: [validate, crates-io]
    if: success() && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 20
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: release-assets
          path: release
      - name: maturin upload --skip-existing
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_PUBLISH }}
        run: maturin upload --non-interactive --skip-existing release/*.whl release/*.tar.gz

  forgejo-release:
    name: Forgejo release
    needs: [validate, pypi]
    if: success() && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: release-assets
          path: release
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: release-notes
          path: notes
      - name: Draft, upload, publish
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          python3 scripts/release/release_api.py forgejo --tag "$TAG" --commit "$COMMIT" \
            --notes notes/notes.md --assets release

  github-release:
    name: GitHub release copy
    needs: [validate, smoke, forgejo-release]
    if: success() && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: release-assets
          path: release
      - uses: https://code.forgejo.org/forgejo/download-artifact@769f970437aa3291b13f35dc23fc87967d7fb19f # v7
        with:
          name: release-notes
          path: notes
      # Checks again that the mirror's tag points at the release commit (the
      # preflight waited for it), then publishes the draft the smoke job staged
      # and tested: it must be that draft, holding exactly these files, every
      # asset's digest checked, and nothing is uploaded or deleted.
      - name: Check and publish the smoke-tested draft
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          STAGED_RELEASE: ${{ needs.smoke.outputs.release_id }}
          STAGED_SUMS: ${{ needs.smoke.outputs.sums_sha256 }}
        run: |
          # Fails closed: only the smoke-tested draft is ever published (the script checks too).
          [ -n "$STAGED_RELEASE" ] && [ -n "$STAGED_SUMS" ] \
            || { echo "::error::the smoke job gave no staged draft, so nothing is published"; exit 1; }
          python3 scripts/release/release_api.py github --tag "$TAG" --commit "$COMMIT" \
            --notes notes/notes-github.md --assets release --wait-tag 900 \
            --staged-release "$STAGED_RELEASE" --staged-sums "$STAGED_SUMS"
