name: Docs

# Validates the website on the Forgejo runner. Publication to GitHub Pages stays
# a manual GitHub workflow (.github/workflows/docs-pages.yml).

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "website/**"
      - ".forgejo/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Docs validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
        shell: bash
    env:
      DOCS_TEST_PORT: "46329"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        run: npm ci
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Check, test and build the production site
        run: npm run verify
